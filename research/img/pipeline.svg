<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .t   { font-size: 13px; fill: #24292f; }
    .lbl { font-size: 12px; fill: #57606a; }
    .hd  { font-size: 14px; font-weight: 600; fill: #24292f; }
    .sm  { font-size: 11px; fill: #6e7781; }
    .mb0 { fill: #6f9dd9; } .mb1 { fill: #7fb069; } .mb2 { fill: #e0a458; } .mb3 { fill: #c98bb9; }
    .bub { fill: #eaeef2; stroke: #d0d7de; stroke-dasharray: 3 2; }
    .cell{ stroke: #ffffff; stroke-width: 1; }
    .ax  { stroke: #8c959f; stroke-width: 1; }
  </style>

  <text x="16" y="24" class="hd">파이프라인 구조 — 마이크로배치가 스테이지를 순서대로 통과한다</text>
  <text x="16" y="44" class="sm">예: N = 4 스테이지, M = 4 마이크로배치. 가로축은 시간, 한 칸이 스테이지 1회 계산.</text>

  <!-- 프롬프트 분할 -->
  <text x="16" y="78" class="t">프롬프트 S 토큰</text>
  <rect x="150" y="64" width="440" height="20" fill="#f6f8fa" stroke="#d0d7de"/>
  <line x1="260" y1="64" x2="260" y2="84" class="ax"/>
  <line x1="370" y1="64" x2="370" y2="84" class="ax"/>
  <line x1="480" y1="64" x2="480" y2="84" class="ax"/>
  <rect x="150" y="64" width="110" height="20" class="mb0 cell" opacity="0.85"/>
  <rect x="260" y="64" width="110" height="20" class="mb1 cell" opacity="0.85"/>
  <rect x="370" y="64" width="110" height="20" class="mb2 cell" opacity="0.85"/>
  <rect x="480" y="64" width="110" height="20" class="mb3 cell" opacity="0.85"/>
  <text x="205" y="79" class="sm" text-anchor="middle" fill="#fff">mb0</text>
  <text x="315" y="79" class="sm" text-anchor="middle" fill="#fff">mb1</text>
  <text x="425" y="79" class="sm" text-anchor="middle" fill="#fff">mb2</text>
  <text x="535" y="79" class="sm" text-anchor="middle" fill="#fff">mb3</text>
  <text x="604" y="79" class="lbl">각 청크 = B 토큰,  M = ⌈S/B⌉</text>

  <!-- 간트 -->
  <text x="16" y="122" class="t">시간 →</text>
  <g>
    <!-- 축 라벨 -->
    <text x="16" y="152" class="t">stage0</text>
    <text x="16" y="192" class="t">stage1</text>
    <text x="16" y="232" class="t">stage2</text>
    <text x="16" y="272" class="t">stage3</text>
    <text x="16" y="290" class="sm">+lm_head</text>

    <!-- 격자 -->
    <g stroke="#eaeef2">
      <line x1="90" y1="132" x2="790" y2="132"/>
      <line x1="90" y1="172" x2="790" y2="172"/>
      <line x1="90" y1="212" x2="790" y2="212"/>
      <line x1="90" y1="252" x2="790" y2="252"/>
      <line x1="90" y1="292" x2="790" y2="292"/>
    </g>

    <!-- stage0: mb0..mb3 at t=0..3 -->
    <rect x="90"  y="134" width="98" height="34" class="mb0 cell"/>
    <rect x="188" y="134" width="98" height="34" class="mb1 cell"/>
    <rect x="286" y="134" width="98" height="34" class="mb2 cell"/>
    <rect x="384" y="134" width="98" height="34" class="mb3 cell"/>
    <rect x="482" y="134" width="294" height="34" class="bub"/>

    <!-- stage1: shifted 1 -->
    <rect x="90"  y="174" width="98" height="34" class="bub"/>
    <rect x="188" y="174" width="98" height="34" class="mb0 cell"/>
    <rect x="286" y="174" width="98" height="34" class="mb1 cell"/>
    <rect x="384" y="174" width="98" height="34" class="mb2 cell"/>
    <rect x="482" y="174" width="98" height="34" class="mb3 cell"/>
    <rect x="580" y="174" width="196" height="34" class="bub"/>

    <!-- stage2 -->
    <rect x="90"  y="214" width="196" height="34" class="bub"/>
    <rect x="286" y="214" width="98" height="34" class="mb0 cell"/>
    <rect x="384" y="214" width="98" height="34" class="mb1 cell"/>
    <rect x="482" y="214" width="98" height="34" class="mb2 cell"/>
    <rect x="580" y="214" width="98" height="34" class="mb3 cell"/>
    <rect x="678" y="214" width="98" height="34" class="bub"/>

    <!-- stage3 -->
    <rect x="90"  y="254" width="294" height="34" class="bub"/>
    <rect x="384" y="254" width="98" height="34" class="mb0 cell"/>
    <rect x="482" y="254" width="98" height="34" class="mb1 cell"/>
    <rect x="580" y="254" width="98" height="34" class="mb2 cell"/>
    <rect x="678" y="254" width="98" height="34" class="mb3 cell"/>

    <!-- 시간 눈금 -->
    <line x1="90" y1="300" x2="776" y2="300" class="ax"/>
    <g class="sm" text-anchor="middle">
      <text x="139" y="314">t0</text><text x="237" y="314">t1</text>
      <text x="335" y="314">t2</text><text x="433" y="314">t3</text>
      <text x="531" y="314">t4</text><text x="629" y="314">t5</text>
      <text x="727" y="314">t6</text>
    </g>
  </g>

  <!-- 버블 표시 -->
  <path d="M96 254 L 96 300" stroke="#cf222e" stroke-width="0" />
  <rect x="90" y="326" width="16" height="12" class="bub"/>
  <text x="114" y="336" class="lbl">버블 (fill / drain 구간에서 노는 스테이지)</text>

  <text x="16" y="366" class="t">총 시간 = (M + N − 1) 칸    ·    이상적 = M 칸</text>
  <text x="16" y="388" class="t">버블 비율 = (N − 1) / (M + N − 1)  =  3/7 = 43 %  ← M 이 작으면 치명적</text>
  <text x="16" y="410" class="t">속도향상 상한 = M·N / (M + N − 1)  =  16/7 = 2.3×   (N=4 인데 2.3배뿐)</text>

  <text x="470" y="388" class="lbl">M 을 키우면 (= B 를 줄이면) 버블이 줄어든다.</text>
  <text x="470" y="410" class="lbl">M = 32 이면 버블 8.6 %, 상한 3.66×.</text>
</svg>
