<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .t   { font-size: 13px; fill: #24292f; }
    .lbl { font-size: 12px; fill: #57606a; }
    .hd  { font-size: 14px; font-weight: 600; fill: #24292f; }
    .sm  { font-size: 11px; fill: #6e7781; }
    .bad { fill: #ffebe9; stroke: #cf222e; }
    .ok  { fill: #dafbe1; stroke: #1a7f37; }
    .ax  { stroke: #8c959f; stroke-width: 1.5; }
    .red { stroke: #cf222e; stroke-width: 2; fill: none; }
    .grn { stroke: #1a7f37; stroke-width: 2; fill: none; }
  </style>

  <text x="16" y="24" class="hd">결합 제약 — 두 힘이 B 를 반대 방향으로 민다</text>
  <text x="16" y="44" class="sm">실현 가능 구간:  B_min ≤ B ≤ S/N.  구간이 공집합이면 (S &lt; N·B_min) 분산이 성립하지 않는다.</text>

  <!-- 두 곡선 -->
  <g transform="translate(60,70)">
    <text x="0" y="0" class="t">토큰당 비용 (낮을수록 좋다)</text>
    <!-- 축 -->
    <line x1="0" y1="150" x2="700" y2="150" class="ax"/>
    <line x1="0" y1="20" x2="0" y2="150" class="ax"/>
    <text x="700" y="170" class="sm" text-anchor="end">청크 폭 B →</text>

    <!-- 커널 비효율 곡선 (작은 B 에서 급등) -->
    <path d="M20 40 C 60 50, 90 120, 150 138 L 700 145" class="red"/>
    <text x="30" y="34" class="sm" fill="#cf222e">커널 효율 손실</text>
    <text x="30" y="48" class="sm" fill="#cf222e">(B &lt; B_min 이면 최대 2배)</text>

    <!-- 버블 곡선 (큰 B 에서 급등) -->
    <path d="M20 145 L 420 138 C 520 128, 600 60, 660 34" class="grn"/>
    <text x="600" y="24" class="sm" fill="#1a7f37" text-anchor="end">파이프라인 버블</text>
    <text x="600" y="38" class="sm" fill="#1a7f37" text-anchor="end">(M = ⌈S/B⌉ 가 N 에 가까워짐)</text>

    <!-- 최적 구간 음영 -->
    <rect x="150" y="20" width="270" height="130" fill="#0969da" opacity="0.07"/>
    <line x1="150" y1="20" x2="150" y2="158" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="420" y1="20" x2="420" y2="158" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="150" y="176" class="sm" text-anchor="middle" fill="#cf222e">B_min = 16</text>
    <text x="150" y="190" class="sm" text-anchor="middle" fill="#cf222e">(Pi5 실측)</text>
    <text x="420" y="176" class="sm" text-anchor="middle" fill="#1a7f37">S / N</text>
    <text x="420" y="190" class="sm" text-anchor="middle" fill="#1a7f37">(M ≥ N 조건)</text>
    <text x="285" y="14" class="t" text-anchor="middle" fill="#0969da">실현 가능 구간</text>
  </g>

  <!-- 아래: 세 가지 상황 -->
  <text x="16" y="300" class="hd">프롬프트 길이가 구간을 좌우한다 (N = 8 고정)</text>

  <!-- case 1 -->
  <text x="16" y="330" class="t">S = 112</text>
  <line x1="120" y1="326" x2="560" y2="326" class="ax"/>
  <rect x="120" y="318" width="100" height="16" class="bad"/>
  <text x="170" y="330" class="sm" text-anchor="middle" fill="#cf222e">S/N = 14</text>
  <line x1="240" y1="312" x2="240" y2="340" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="248" y="331" class="sm" fill="#cf222e">B_min = 16 &gt; S/N = 14  →  구간 공집합</text>
  <text x="600" y="331" class="t" fill="#cf222e">실측 0.82× (단일보다 느림)</text>

  <!-- case 2 -->
  <text x="16" y="368" class="t">S = 224</text>
  <line x1="120" y1="364" x2="560" y2="364" class="ax"/>
  <rect x="240" y="356" width="60" height="16" class="ok"/>
  <line x1="240" y1="350" x2="240" y2="378" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="300" y1="350" x2="300" y2="378" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="240" y="392" class="sm" text-anchor="middle" fill="#cf222e">16</text>
  <text x="300" y="392" class="sm" text-anchor="middle" fill="#1a7f37">28</text>
  <text x="320" y="369" class="sm">구간 좁음 → B = 16 만 가능</text>
  <text x="600" y="369" class="t" fill="#1a7f37">실측 4.12×</text>

  <!-- case 3 -->
  <text x="16" y="418" class="t">S = 2048</text>
  <line x1="120" y1="414" x2="560" y2="414" class="ax"/>
  <rect x="240" y="406" width="280" height="16" class="ok"/>
  <line x1="240" y1="400" x2="240" y2="428" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="520" y1="400" x2="520" y2="428" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="240" y="442" class="sm" text-anchor="middle" fill="#cf222e">16</text>
  <text x="520" y="442" class="sm" text-anchor="middle" fill="#1a7f37">256</text>
  <text x="380" y="419" class="sm" text-anchor="middle">구간 넓음 → B 선택이 1.85배를 가른다</text>
  <text x="600" y="419" class="t" fill="#1a7f37">B=8: 2.34×  ·  B=32: 4.60×</text>

  <text x="16" y="462" class="lbl">기존 휴리스틱은 프롬프트가 길수록 B 를 줄인다 — 넓어진 구간을 쓰지 않고 하한 아래로 내려간다.</text>
</svg>
